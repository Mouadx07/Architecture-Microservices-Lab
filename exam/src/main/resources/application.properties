spring.application.name=exam-ioc-hibernate

# Connexion MySQL (conteneur Docker "springboot-mysql", port 3306)
spring.datasource.url=jdbc:mysql://localhost:3306/produits_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=devuser
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Sortie console propre (seulement nos println)
spring.main.banner-mode=off
logging.level.root=WARN
