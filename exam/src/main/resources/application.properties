# ===================================================================
# Configuration de l'application - Examen Spring IoC & Hibernate
# ===================================================================
spring.application.name=tp4-examen

# -------------------------------------------------------------------
# Configuration Base de donnees H2 (en memoire)
# Utilisee par defaut pour une execution autonome sans prerequis
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:product_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# -------------------------------------------------------------------
# Configuration MySQL (decommenter pour utiliser MySQL)
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/product_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=

# -------------------------------------------------------------------
# Proprietes Hibernate
# -------------------------------------------------------------------
hibernate.hbm2ddl.auto=update
hibernate.show_sql=false
hibernate.format_sql=false
