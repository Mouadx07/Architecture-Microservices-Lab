server:
  port: 8888

spring:
  application:
    name: Gateway
  cloud:
    discovery:
      enabled: true
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # une route est creee automatiquement pour chaque service connu par Eureka
              enabled: true
              lower-case-service-id: false

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
    instance-id: "${spring.application.name}:${server.port}"
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      # l'endpoint /actuator/gateway est desactive par defaut
      access: unrestricted

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO
